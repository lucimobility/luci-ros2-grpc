name: Create and Sign Package

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  REPO: ${{github.event.repository.name}}
  MESSAGE_REPO: luci-ros2-msgs

jobs:
  package:
    runs-on: ubuntu-latest
    container: ghcr.io/lucimobility/luci-sdk-development-image:latest
    steps:
      # Generate GitHub App token
      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            luci-ros2-msgs
            luci-ros2-grpc

      - name: Checkout LUCI Messages Branch
        uses: actions/checkout@v3
        with:
          repository: lucimobility/luci-ros2-msgs
          ref: main
          path: ${{env.MESSAGE_REPO}}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout GRPC Branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
          path: ${{env.REPO}}
          token: ${{ steps.generate-token.outputs.token }}
      
      - name: gpg import
        id: "import"
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          # Sets private key to import
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          # Sets passphrase to use for the private key
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          # Says we trust it 100%
          trust_level: 5

      # cd into the message repo and run ITS build-package script
      - name: Build the msg package
        run: |
          cd ${{env.MESSAGE_REPO}}
          source /opt/ros/humble/setup.bash
          colcon build
        shell: bash

      - name: Build the gRPC package
        run: |
          cd ${{env.MESSAGE_REPO}}
          source install/setup.bash
          cd ../${{env.REPO}}/luci_grpc_interface
          ./build-package.sh
        shell: bash

      - name: Sign the package
        run: |
          echo "Output [${{steps.import.outputs.keyid}}]"
          cd ${{env.REPO}}/luci_grpc_interface
          ./sign-package.sh
        shell: bash
        env:
          KEY_ID: ${{steps.import.outputs.keyid}}

      # build-package.sh writes the .deb next to the package directory
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{env.REPO}}/*.deb
          if-no-files-found: error

  # Runs on the runner itself, since the development image has no AWS CLI.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Add the package to the apt pool
        run: |
          for deb in *.deb; do
            package=$(dpkg-deb --field "$deb" Package)
            aws s3 cp --only-show-errors "$deb" "s3://${{ vars.SDK_SITE_BUCKET }}/ros2/apt/pool/main/$package/$deb"
          done
        shell: bash

      # The index is rebuilt in luci-ros2-sdk, which signs it with the archive key
      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: luci-ros2-sdk

      - name: Rebuild the apt index
        run: gh workflow run publish-apt.yml --repo lucimobility/luci-ros2-sdk
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
